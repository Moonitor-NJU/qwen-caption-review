function draw(){const root=document.querySelector('#groups');root.replaceChildren();for(const g of filtered.slice(current*perPage,(current+1)*perPage)){const section=el('section');section.append(el('h2',g.label),el('p','官方命名标签 · '+g.audio.length+'条不同文件 · 同人关系待核验'));const grid=el('div');grid.className='audio-grid';for(const r of g.audio){const box=el('div');box.className='record';box.append(el('p',r.name),el('p',r.seconds+'秒 / RMS '+r.rms+' dBFS'));const a=el('audio');a.controls=true;a.preload='metadata';a.src=r.url;a.addEventListener('play',()=>{for(const b of document.querySelectorAll('audio'))if(a!==b)b.pause()});const link=el('a','官方文件');link.href=r.source;link.target='_blank';link.rel='noopener';const field=el('textarea');field.placeholder='试听备注';field.setAttribute('aria-label',r.name+' 备注');field.dataset.name=r.name;try{field.value=localStorage.getItem(key+r.name)||''}catch{}field.oninput=()=>{try{localStorage.setItem(key+r.name,field.value);document.querySelector('#save').textContent='已保存到本浏览器'}catch{document.querySelector('#save').textContent='保存失败，请导出'}};box.append(a,link,field);grid.append(box)}section.append(grid);root.append(section)}const pages=Math.max(1,Math.ceil(filtered.length/perPage));document.querySelector('#position').textContent=(current+1)+' / '+pages+'页 · '+filtered.length+'组 / '+filtered.reduce((n,g)=>n+g.audio.length,0)+'条';document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current+1>=pages}
function filter(){const scope=document.querySelector('#scope').value,cat=document.querySelector('#category').value,q=document.querySelector('#query').value.toLowerCase();filtered=data.filter(g=>(scope!=='clone'||g.clone_selected)&&(cat==='all'||g.category===cat)&&g.label.toLowerCase().includes(q));current=0;draw()}
for(const id of ['scope','category','query'])document.getElementById(id).addEventListener('input',filter);document.querySelector('#prev').onclick=()=>{current--;draw()};document.querySelector('#next').onclick=()=>{current++;draw()};document.querySelector('#export').onclick=()=>{const notes={};for(const g of data)for(const r of g.audio){try{notes[r.name]=localStorage.getItem(key+r.name)||''}catch{}}const u=URL.createObjectURL(new Blob([JSON.stringify({version:'cv3-audit-20261118',notes},null,2)],{type:'application/json'}));const a=el('a');a.href=u;a.download='cv3_audition_notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};filter();
</script></html>
